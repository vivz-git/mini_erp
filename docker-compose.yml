services:
  postgres:
    image: postgres:16-alpine
    container_name: minierp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: minierp
    ports:
      - "5432:5432"
    volumes:
      - minierp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minierp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minierp_pgdata:
    driver: local
